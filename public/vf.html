<body>
<!-- VesselFinder ücretsiz gömülü gemi haritası (Seyhun 2026-10-23: "VesselFinder'ı kullanalım"). Deniz trafiği
     sayfası bunu iframe ile açar; aismap.js document.write kullandığı için kendi sayfasında durur.
     ?lat=&lon=&z=&h= (h: piksel yükseklik), names=1 gemi adları sürekli görünür. -->
<script>
  var q = new URLSearchParams(location.search);
  var num = function (k, d) { var v = parseFloat(q.get(k)); return isFinite(v) ? v : d; };
  var width = "100%";
  var height = String(Math.round(num("h", 300)));
  var latitude = num("lat", 39.07).toFixed(4);
  var longitude = num("lon", 26.85).toFixed(4);
  var zoom = String(Math.round(Math.min(18, Math.max(3, num("z", 10)))));
  var names = q.get("names") === "1";
  document.write('<script src="https://www.vesselfinder.com/aismap.js"><\/script>');
</script>
</body>
