<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/tanitim/simulator/">
<title>Velora Simülatör</title>
<meta name="description" content="Denize çıkmadan yarışa hazırlan: hazır taktikler, elle sürüş, 3D ve yelken ayarı.">
<meta property="og:title" content="Velora Simülatör">
<meta property="og:description" content="Denize çıkmadan yarışa hazırlan: hazır taktikler, elle sürüş, 3D ve yelken ayarı.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="/favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* "Velora'da bir gün" (Seyhun 2026-11-26 "Yap"): uygulamanın Sahne dili. Siyah zemin, limon vurgu, dar kalın başlık.
   Her bölüm gerçek ekran kaydı; telefon, iPad ve projektör çerçeveleri her sahnede aynı. Tek koyu görünüm (bilerek). */
:root{
  --bg:#0b0b0c; --card:#161618; --line:#26262a; --fg:#f4f4f2; --mut:#9a9aa0; --lime:#d4ff3a; --ink:#0f0f11;
  --f-head:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --f-text:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-text);-webkit-font-smoothing:antialiased}
.show{height:100%;display:flex;flex-direction:column}
.shd{position:relative;z-index:5;display:flex;align-items:center;gap:clamp(10px,2vw,18px);padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:clamp(52px,8vh,72px);border-bottom:1px solid #1c1c1f;background:#0b0b0c}
.brand{display:flex;align-items:center;gap:10px;font:800 1.45rem/1 var(--f-head);letter-spacing:.02em;text-transform:uppercase;flex:none}
.brand svg{width:30px;height:30px;border-radius:8px;box-shadow:0 0 0 1px #2a2a2e}
.say{margin:0;flex:1;min-width:0;font:600 clamp(1rem,1.8vw,1.3rem)/1.3 var(--f-text);color:#ececed;transition:opacity .35s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.say.out{opacity:0}
.say span{display:inline-block;opacity:0;transform:translateY(6px);animation:up .45s both}
/* ilerleme: en üstte ince bölüm çizgileri */
.tabs{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;gap:3px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;min-width:0;border:0;background:none;padding:4px 0 6px;cursor:pointer}
.tabs button span{display:block;position:relative;height:3px;border-radius:99px;background:#2a2a2e;overflow:hidden}
.tabs button span i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--lime)}
.tabs button.done span{background:#6f7d3a}
.tabs button:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:4px}
@media (max-width:40rem){.brand span{display:none}.brand svg{width:28px;height:28px}}
@media (max-height:30rem){.shd{min-height:44px;padding-block:calc(8px + env(safe-area-inset-top,0px)) 6px}.say{font-size:.95rem}}
.vpt{flex:1;min-height:0;position:relative}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s;background:#000}
.slide.on{opacity:1;visibility:visible;transition:opacity .7s ease}
.slide .box{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vmin,40px)}
/* tam ekran kayıt (Seyhun 2026-11-26 "küçük ortada değil, tam ekran") */
.full{position:absolute;inset:0;overflow:hidden;background:#000}
.full video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transform:scale(1.015);transition:transform 6s ease-out}
.slide.on .full video{transform:none}
.rkf{background:#0b0b0c;font-size:clamp(6px,min(1.5vw,2vh),17px)}
.rkf .rk{max-width:70rem;margin:0 auto;padding:5vh max(16px,4vw)}
/* sahne ışığı: her cihazın arkasında hafif limon parıltı */
.box::before{content:"";position:absolute;left:50%;top:52%;width:70%;height:70%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(212,255,58,.08),transparent 70%);pointer-events:none}

/* çerçeveler: JS ölçer (fit), oran ekran kaydının oranı */
.dv{position:relative;flex:none;background:#050506;box-shadow:0 0 0 1.5px #2c2c31,0 40px 80px -30px rgba(0,0,0,.9);transform:translateY(14px) scale(.985);opacity:0;transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .8s}
.slide.on .dv{transform:none;opacity:1}
.dv video{display:block;width:100%;height:100%;object-fit:cover;background:#0b0b0c}
.ph{border-radius:13%/6%}
.ph .scr{position:absolute;border-radius:10%/4.7%;overflow:hidden}
.pd{border-radius:3.4%/4.9%}
.pd .scr{position:absolute;overflow:hidden;border-radius:1.6%/2.3%}
.dv .scr video{position:absolute;inset:0}

/* projektör odası */
.room{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 50% 8%,#1c1c21 0%,#0e0e11 55%,#060607 100%);box-shadow:inset 0 0 0 1px var(--line)}
.room .beam{position:absolute;inset:0;width:100%;height:100%}
.room .wall{position:absolute;border-radius:5px;overflow:hidden;background:#0b0b0c;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 0 80px rgba(212,255,58,.12)}
.room .wall video{display:block;width:100%;height:100%;object-fit:cover}
.room .ppl{position:absolute;left:0;right:0;bottom:0;width:100%;height:27%;pointer-events:none}
@media (orientation:portrait){.room .ppl{height:20%}}
.slide.on .room .wall{animation:lamp 1.2s ease both}
@keyframes lamp{0%{filter:brightness(.2)}60%{filter:brightness(1.15)}100%{filter:none}}

/* açılış ve kapanış */
.sea{position:absolute;inset:0;border-radius:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#17171b 0%,#0b0b0c 55%,#050506 100%)}
.sea svg{position:absolute;inset:0;width:100%;height:100%}
.vign{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 50%,transparent 40%,rgba(0,0,0,.6) 100%);pointer-events:none}
.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,24px);text-align:center;padding:24px}
.mark{position:relative;width:clamp(76px,14vmin,140px);aspect-ratio:1;opacity:0}
.mark svg{position:relative;width:100%;height:100%;border-radius:24%;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1)}
.ring{position:absolute;inset:-14%;border-radius:50%;border:2px solid rgba(212,255,58,.6);opacity:0}
.wm{margin:0;font:800 clamp(3rem,12vmin,7.5rem)/.9 var(--f-head);text-transform:uppercase;letter-spacing:.01em;display:flex;gap:.22em;flex-wrap:wrap;justify-content:center}
.wm span{display:inline-flex}.wm i{display:inline-block;font-style:normal;opacity:0;transform:translateY(.45em);filter:blur(6px)}
.wm .w2 i{color:var(--lime)}
.tag{margin:0;font:500 clamp(1rem,2.6vmin,1.5rem)/1.35 var(--f-text);color:#cfcfd2;opacity:0;transform:translateY(10px)}
.kick{font:700 clamp(.72rem,1.7vmin,.9rem)/1 var(--f-text);letter-spacing:.16em;text-transform:uppercase;color:var(--lime);opacity:0}
.slide.on .mark{animation:mk 1.1s .25s cubic-bezier(.2,.9,.3,1.3) both}
.slide.on .mark .r1{animation:rg 2.6s 1s ease-out infinite}.slide.on .mark .r2{animation:rg 2.6s 2.3s ease-out infinite}
.slide.on .wm i{animation:ltr .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.05s + var(--j)*55ms)}
.slide.on .kick{animation:up .7s .7s ease both}
.slide.on .tag{animation:up .8s 2.3s ease both}
.slide.on .hero{animation:push 9s 1s linear both}
.pills{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:44rem}
.pills li{font:600 clamp(.8rem,2vmin,1rem) var(--f-text);padding:.45em .95em;border-radius:999px;background:#161618;box-shadow:inset 0 0 0 1px #2c2c31;color:#e6e6e8;opacity:0;transform:translateY(8px)}
.slide.on .pills li{animation:up .6s both;animation-delay:calc(2s + var(--j)*.13s)}
.out .tag{animation-delay:3.2s!important}
@keyframes mk{0%{opacity:0;transform:scale(.4) rotate(-12deg)}100%{opacity:1;transform:none}}
@keyframes rg{0%{opacity:.8;transform:scale(.8)}100%{opacity:0;transform:scale(1.7)}}
@keyframes ltr{to{opacity:1;transform:none;filter:none}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.05)}}

/* sıralama (duvarda) */
.rk{position:absolute;inset:0;display:flex;flex-direction:column;padding:5% 7%;gap:2.5%;font-size:var(--u,14px)}
.rk h3{margin:0;font:800 3.4em/1 var(--f-head);text-transform:uppercase;letter-spacing:.01em;opacity:0;transform:translateY(10px)}
.rk .k{font:700 .85em var(--f-text);letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
.slide.on .rk h3{animation:up .6s .9s both}
.rk ol{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:2.6%}
.rk li{display:grid;grid-template-columns:2.4em 4.2em 1fr 4.6em;align-items:center;gap:1.2em;padding:.5em 1.1em;border-radius:.9em;background:#141416;box-shadow:inset 0 0 0 1px #26262a;opacity:0;transform:translateX(-30px)}
.slide.on .rk li{animation:up .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.3s + var(--r)*.3s)}
.rk .rn{width:2.1em;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:800 1.35em var(--f-head);background:#222226}
.rk li:first-child{background:#1a1d10;box-shadow:inset 0 0 0 1px rgba(212,255,58,.45)}
.rk li:first-child .rn{background:var(--lime);color:var(--ink)}
.rk .sl{font:800 1.5em var(--f-head);color:#d8d8da}
.rk .nm{display:flex;align-items:center;gap:1em;font:600 1.15em var(--f-text);min-width:0}
.rk .bar{flex:1;height:.4em;border-radius:99px;background:#222226;overflow:hidden}
.rk .bar b{display:block;height:100%;width:0;border-radius:99px;background:#5a5a60}
.rk li:first-child .bar b{background:var(--lime)}
.slide.on .rk .bar b{animation:bar 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.7s + var(--r)*.3s)}
@keyframes bar{to{width:var(--w)}}
.rk .tm{font:700 1.5em var(--f-head);text-align:right;font-variant-numeric:tabular-nums}

/* son ekran: dikkat çeken katıl / giriş (Seyhun 2026-11-26 "kullanıcıyı çekecek, cezbedecek") */
.cta{position:absolute;inset:0;overflow:auto;background:radial-gradient(120% 90% at 50% 0%,#17171b 0%,#0b0b0c 55%,#050506 100%)}
.cta-sea{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.cta .cin{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(12px,2.4vh,22px);padding-block:clamp(24px,5vh,56px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cta .lg{width:clamp(56px,9vmin,84px);aspect-ratio:1;display:block}
.cta .lg svg{width:100%;height:100%;border-radius:24%;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1)}
.cta .k{font:700 clamp(.72rem,1.7vmin,.9rem)/1 var(--f-text);letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
.cta h2{margin:0;font:800 clamp(2.6rem,10vmin,6.4rem)/.9 var(--f-head);text-transform:uppercase;text-wrap:balance}
.cta h2 em{font-style:normal;color:var(--lime)}
.cta .pros{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:40rem}
.cta .pros li{font:600 clamp(.8rem,2vmin,1rem) var(--f-text);padding:.45em .95em;border-radius:999px;background:#161618;box-shadow:inset 0 0 0 1px #2c2c31;color:#e6e6e8}
.cta .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%;max-width:34rem;margin-top:clamp(4px,1vh,12px)}
.cta .btns a{flex:1 1 13rem;display:inline-flex;align-items:center;justify-content:center;gap:.5em;height:clamp(56px,8vh,68px);border-radius:16px;text-decoration:none;font:800 clamp(1.3rem,3vmin,1.7rem)/1 var(--f-head);text-transform:uppercase;letter-spacing:.03em;transition:transform .08s,box-shadow .08s}
.cta .b1{background:var(--lime);color:var(--ink);box-shadow:0 5px 0 #8ea620,0 0 0 0 rgba(212,255,58,.55)}
.slide.on .cta .b1{animation:glow 2.4s 1.6s ease-out infinite}
.cta .b1:active{transform:translateY(4px);box-shadow:0 1px 0 #8ea620}
.cta .b1 span{transition:transform .2s}.cta .b1:hover span{transform:translateX(4px)}
.cta .b2{background:#161618;color:var(--fg);box-shadow:inset 0 0 0 1.5px #3a3a40,0 5px 0 #050506}
.cta .b2:active{transform:translateY(4px);box-shadow:inset 0 0 0 1.5px #3a3a40,0 1px 0 #050506}
.cta a:focus-visible,.cta .ag:focus-visible{outline:3px solid #fff;outline-offset:3px}
.cta .sm{margin:0;color:var(--mut);font-size:.85rem}
.cta .ag{background:none;border:0;color:#cfcfd2;font:600 .9rem var(--f-text);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
@keyframes glow{0%{box-shadow:0 5px 0 #8ea620,0 0 0 0 rgba(212,255,58,.5)}70%{box-shadow:0 5px 0 #8ea620,0 0 0 18px rgba(212,255,58,0)}100%{box-shadow:0 5px 0 #8ea620,0 0 0 0 rgba(212,255,58,0)}}
.cta .cin>*{opacity:0;transform:translateY(12px)}
.slide.on .cta .cin>*{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.slide.on .cta .cin>:nth-child(2){animation-delay:.1s}.slide.on .cta .cin>:nth-child(3){animation-delay:.2s}.slide.on .cta .cin>:nth-child(4){animation-delay:.45s}.slide.on .cta .cin>:nth-child(5){animation-delay:.7s}.slide.on .cta .cin>:nth-child(6),.slide.on .cta .cin>:nth-child(7){animation-delay:.9s}

.hint{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:6;border:0;background:#161618;color:#e6e6e8;font:600 .8rem var(--f-text);padding:.5em .9em;border-radius:99px;box-shadow:inset 0 0 0 1px #2c2c31;cursor:pointer;opacity:.0;transition:opacity .3s}
.hint:focus-visible,.paused .hint{opacity:1}
@media (prefers-reduced-motion:reduce){.cta .cin>*,.cta .b1,.wm i,.tag,.kick,.pills li,.mark,.dv,.rk h3,.rk li{opacity:1!important;transform:none!important;filter:none!important;animation:none!important}.rk .bar b{width:var(--w)!important}}
</style>

</head>
<body>
<div class="show" id="show">
  <header class="shd">
    <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#0f0f11"/><circle cx="50" cy="52" r="30" fill="#d4ff3a"/><path d="M26 19 L35.6 19 C 42 35, 46 47.8, 50 55.8 L59.6 19 L74 19 L56.4 67 L43.6 67 Z" fill="#0f0f11"/></svg><span>Velora</span></div>
    <p class="say" id="say" aria-live="polite"></p>
    <nav class="tabs" id="tabs" aria-label="Bölümler"></nav>
  </header>
  <div class="vpt" id="vpt"></div>
  <button type="button" class="hint" id="pp">Durdur</button>
</div>

<script src="/tanitim/engine.js"></script>
<script src="/tanitim/boat-draw.js"></script>
<script>
(function(){
const LOGO='<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#0f0f11"/><circle cx="50" cy="52" r="30" fill="#d4ff3a"/><path d="M26 19 L35.6 19 C 42 35, 46 47.8, 50 55.8 L59.6 19 L74 19 L56.4 67 L43.6 67 Z" fill="#0f0f11"/></svg>';
const SIL='#08080a',RIM='#2a2a30';
const seat=(x,s,c)=>`<g transform="translate(${x} 268) scale(${s})"><path d="M-46 0 C-46 -52 -36 -78 0 -80 C36 -78 46 -52 46 0Z" fill="${SIL}" stroke="${RIM}" stroke-width="2"/><circle cy="-104" r="26" fill="${SIL}" stroke="${RIM}" stroke-width="2"/><path d="M-26 -112 a26 26 0 0 1 52 0" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" opacity=".85"/></g>`;
const PEOPLE=`<svg class="ppl" viewBox="0 0 1000 270" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
 <g transform="translate(150 270)">
  <path d="M-30 0 L-22 -120 L22 -120 L30 0 L12 0 L4 -70 L-4 -70 L-12 0Z" fill="${SIL}" stroke="${RIM}" stroke-width="2"/>
  <path d="M-30 -118 C-32 -170 -24 -196 0 -198 C24 -196 32 -170 30 -118Z" fill="${SIL}" stroke="${RIM}" stroke-width="2"/>
  <path d="M22 -186 L74 -238" stroke="${SIL}" stroke-width="15" stroke-linecap="round"/>
  <path d="M-24 -178 L-40 -140 L-14 -132" fill="none" stroke="${SIL}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="-46" y="-164" width="40" height="30" rx="4" fill="#1a1a1d" stroke="#3a3a40" stroke-width="2" transform="rotate(-14 -27 -149)"/>
  <circle cy="-222" r="23" fill="${SIL}" stroke="${RIM}" stroke-width="2"/>
 </g>
 <g transform="translate(500 270)"><rect x="-8" y="-40" width="16" height="40" fill="${SIL}" stroke="${RIM}" stroke-width="2"/><rect x="-46" y="-66" width="92" height="28" rx="7" fill="#141416" stroke="${RIM}" stroke-width="2"/><circle class="lens" cx="30" cy="-58" r="9" fill="#f1ffc4"/><circle cx="30" cy="-58" r="18" fill="#d4ff3a" opacity=".22"/></g>
 ${seat(330,1,'#d4ff3a')}${seat(420,.86,'#e0675e')}${seat(610,.9,'#5b8cff')}${seat(705,1,'#d4ff3a')}${seat(820,.84,'#f59e0b')}
</svg>`;

/* Bölümler (Seyhun 2026-11-26 onaylı akış "Velora'da bir gün"). rate: kayıt hızı; d: gösterim süresi (sn) */
const CH=[
  {k:'intro',type:'sea',say:'',d:7.5},
  {k:'taktik',type:'v',v:'taktik',rate:1,say:'Hazır taktikleri adım adım izle'},
  {k:'sur',type:'v',v:'sur',rate:1,say:'Tekneni kendin sür, filoyla start al'},
  {k:'cizim',type:'v',v:'cizim',rate:1,say:'Kendi taktiğini çiz, oynat'},
  {k:'ayar',type:'v',v:'ayar',rate:1,say:'Havaya göre yelken ayarı, 3D'},
  {k:'katil',type:'cta',say:'',d:Infinity},
];
/* Telefonda izleyen telefon görünümünü, iPad/bilgisayar/projektörde izleyen iPad görünümünü görür (Seyhun 2026-11-26) */
const MODE=()=>(innerWidth<700&&innerHeight>innerWidth?'t':'i');
let mode=MODE();
const srcOf=c=>c.one?c.v+'.mp4':`${c.v}-${mode}.mp4`;
const AR={ph:390/844,pad:1180/820};
const vpt=document.getElementById('vpt');
const mk=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const vid=(c)=>`<video muted playsinline preload="auto" disablepictureinpicture aria-label="${c.say}" src="${srcOf(c)}"></video>`;

CH.forEach((c,i)=>{
  const s=document.createElement('section');s.className='slide';s.dataset.k=c.k;s.setAttribute('aria-hidden','true');
  if(c.type==='sea'){
    s.innerHTML=`<div class="box"><div class="sea"><svg preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg><div class="vign"></div>
      <div class="hero${c.out?' out':''}"><span class="kick">Simülatör</span><div class="mark"><span class="ring r1"></span><span class="ring r2"></span>${LOGO}</div>
      <h2 class="wm" aria-label="Velora"><span class="w1"></span></h2>
      ${c.out?'<ul class="pills"><li>Takvim</li><li>Yarış</li><li>Yönet</li><li>Sporcu ekranı</li><li>Video</li><li>Hava</li><li>Gün kaydı</li><li>Yoklama</li><li>Fitness</li><li>Simülatör</li></ul>':''}
      <p class="tag">Denize çıkmadan antrenman.</p></div></div></div>`;
  }else if(c.type==='v'){
    s.innerHTML=`<div class="full">${vid(c)}</div>`;
  }else if(c.type==='cta'){
    s.innerHTML=`<div class="cta"><svg class="cta-sea" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg><div class="vign"></div><div class="cin">
      <span class="lg">${LOGO}</span><span class="k">Velora Simülatör</span>
      <h2>Denize çıkmadan<br><em>yarışa hazırlan</em></h2>
      <ul class="pros"><li>Hazır taktikler</li><li>Elle sürüş ve 3D</li><li>Kendi taktiğin</li><li>Yelken ayarı</li></ul>
      <div class="btns"><a class="b1" href="/tanitim/?k=simulator#katil">Hemen katıl<span aria-hidden="true">→</span></a>
      <a class="b2" href="https://velora-sailing.netlify.app/">Giriş yap</a></div>
      <p class="sm">Velora hesabın varsa aynı hesapla girersin.</p>
      <button type="button" class="ag">Tanıtımı yeniden izle</button></div></div>`;
  }else if(c.type==='rank'){
    s.innerHTML=`<div class="full rkf"><div class="rk"><span class="k">Salı antrenmanı · Didim</span><h3>Sıralama</h3><ol id="rkL"></ol></div></div>`;
  }else if(c.type==='old'){
    s.innerHTML=`<div class="box"><div class="dv ${c.type==='ph'?'ph':'pd'}" data-ar="${AR[c.type]}" data-b="${c.type==='ph'?.032:.022}"><div class="scr">${vid(c.v,c.say)}</div></div></div>`;
  }else if(c.type==='proj'||c.type==='rank'){
    const inner=c.type==='rank'?`<div class="rk"><span class="k">Salı antrenmanı · Didim</span><h3>Sıralama</h3><ol id="rkL"></ol></div>`:vid(c.v,c.say);
    s.innerHTML=`<div class="box"><div class="room" data-ar="${c.ar||1.6}"><svg class="beam" aria-hidden="true"><defs><linearGradient id="bm${i}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#efffc0" stop-opacity=".16"/><stop offset="1" stop-color="#efffc0" stop-opacity=".02"/></linearGradient></defs><polygon fill="url(#bm${i})"/></svg><div class="wall">${inner}</div>${PEOPLE}</div></div>`;
  }
  vpt.appendChild(s);c.el=s;c.v&&(c.video=s.querySelector('video'));
});

/* yazı harfleri */
document.querySelectorAll('.wm').forEach(h=>{const put=(sp,tx,o)=>{sp.innerHTML=[...tx].map((ch,i)=>`<i style="--j:${i+o}">${ch}</i>`).join('')};put(h.querySelector('.w1'),'Velora',0)});
document.querySelectorAll('.pills li').forEach((li,i)=>li.style.setProperty('--j',i));


/* son ekran */
vpt.querySelectorAll('.cta .ag').forEach(b=>b.addEventListener('click',()=>go(0)));

/* sıralama */
const RK=[['305','Ada','18:42',0],['1287','Ece','+0:08',8],['918','Elif','+0:15',15],['77','Lina','+0:31',31],['1302','Deniz','+0:47',47]];
const rkL=document.getElementById('rkL');
if(rkL)rkL.innerHTML=RK.map((r,i)=>`<li style="--r:${i}"><span class="rn">${i+1}</span><span class="sl">${r[0]}</span><span class="nm">${r[1]}<span class="bar"><b style="--w:${100-r[3]/47*60}%"></b></span></span><span class="tm">${r[2]}</span></li>`).join('');

/* ölçü: cihaz çerçevesi kutuya sığar; projektörde duvar ve ışık */
function fitDev(dv){const box=dv.parentNode,W=box.clientWidth,H=box.clientHeight;if(!W||!H)return;
  const ai=+dv.dataset.ar,b=+dv.dataset.b,ao=(1+2*b)/(1/ai+2*b);let w=Math.min(W*.98,H*ao),h=w/ao;
  dv.style.width=w+'px';dv.style.height=h+'px';const sc=dv.querySelector('.scr');
  const p=b*w/(1+2*b);Object.assign(sc.style,{left:p+'px',right:p+'px',top:p+'px',bottom:p+'px'})}
function fitRoom(room){const W=room.clientWidth,H=room.clientHeight;if(!W||!H)return;const ar=+room.dataset.ar,port=W<H*.9;
  const mw=W*(port?.94:.84),mh=H*(port?.58:.68);const w=Math.min(mw,mh*ar),h=w/ar,x0=(W-w)/2,y0=port?Math.max(H*.07,(H*.62-h)/2):H*.05;
  const wall=room.querySelector('.wall');Object.assign(wall.style,{width:w+'px',height:h+'px',left:x0+'px',top:y0+'px'});wall.style.setProperty('--u',Math.max(6,Math.min(15,Math.min(w/60,h/40)))+'px');
  const beam=room.querySelector('.beam'),poly=beam.querySelector('polygon');beam.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const r0=room.getBoundingClientRect(),ln=room.querySelector('.lens').getBoundingClientRect(),lx=ln.left+ln.width/2-r0.left,ly=ln.top+ln.height/2-r0.top;
  poly.setAttribute('points',`${lx},${ly} ${x0},${y0+h} ${x0},${y0} ${x0+w},${y0} ${x0+w},${y0+h}`)}
function fitAll(){document.querySelectorAll('.dv').forEach(fitDev);document.querySelectorAll('.room').forEach(fitRoom)}
new ResizeObserver(fitAll).observe(vpt);fitAll();

/* açılış/kapanış denizi: tekneler bir kez çizilir, her karede yalnız transform değişir */
const E=window.SailEngine,BD=window.BoatDraw,NS='http://www.w3.org/2000/svg';
const el=(t,a,p)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p&&p.appendChild(n);return n};
function makeSea(svg,boatsIn){
  const VW=1600,VH=1000,DT=0.05,TMAX=60;svg.setAttribute('viewBox',`0 0 ${VW} ${VH}`);
  if(!E||!BD)return()=>{};
  const waves=el('g',{},svg),trails=el('g',{},svg),boats=el('g',{},svg);
  let s=11;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
  for(let i=0;i<60;i++){const x=rnd()*VW,y=rnd()*VH,len=26+rnd()*24,o=(.04+rnd()*.08).toFixed(2);
    for(const dy of [0,-VH])el('line',{x1:x,y1:y+dy,x2:x-len*.14,y2:y+dy+len,stroke:'#e9e9ea','stroke-opacity':o,'stroke-width':2,'stroke-linecap':'round'},waves)}
  const B=boatsIn.map((b,i)=>{
    const seed=E.seedOf(String(b.id||i)),N=Math.round(TMAX/DT),P=new Float32Array((N+1)*3);
    let x=b.x,y=b.y,h=b.h,len=0;const L=new Float32Array(N+1);
    for(let k=0;k<=N;k++){const t=k*DT,n=Math.floor(t/b.tack),ph=t-n*b.tack,tgt=n%2?-b.h:b.h,prev=n%2?b.h:-b.h;
      h=(n>0&&ph<1.6)?prev+(tgt-prev)*(0.5-0.5*Math.cos(Math.PI*ph/1.6)):tgt;
      const sp=(n>0&&ph<1.6)?b.v*(0.55+0.45*Math.abs(2*ph/1.6-1)):b.v;
      if(k){const f=E.fwd(h);const nx=x+f.x*sp*DT,ny=y+f.y*sp*DT;len+=Math.hypot(nx-x,ny-y);x=nx;y=ny}
      P[k*3]=x;P[k*3+1]=y;P[k*3+2]=h;L[k]=len}
    let d='';for(let k=0;k<=N;k+=4)d+=(k?'L':'M')+P[k*3].toFixed(1)+','+P[k*3+1].toFixed(1);
    const tr=el('path',{d,fill:'none',stroke:b.color,'stroke-opacity':.45,'stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':`${len} ${len+10}`,'stroke-dashoffset':len},trails);
    const g=el('g',{},boats),poses=[Math.abs(b.h),-Math.abs(b.h)].map(hh=>{const w=el('g',{},g);const inner=el('g',{transform:`scale(${b.s||1.8})`},w);
      BD.draw(inner,'optimist',{color:b.color,pose:E.sailPose(hh,0,{v:b.v,base:55,t:0,seed}),t:0,seed,heading:hh,speed:0});return w});
    return{...b,P,L,N,len,tr,g,poses,cur:-1};
  });
  return function(t){
    waves.setAttribute('transform',`translate(0 ${((t*14)%VH).toFixed(2)})`);
    for(const b of B){const f=Math.max(0,Math.min(b.N-1,t/DT)),k=Math.floor(f),u=f-k,a=k*3,c=a+3;
      const x=b.P[a]+(b.P[c]-b.P[a])*u,y=b.P[a+1]+(b.P[c+1]-b.P[a+1])*u,h=b.P[a+2]+(b.P[c+2]-b.P[a+2])*u;
      const side=h>=0?0:1;if(side!==b.cur){b.cur=side;b.poses.forEach((w,i)=>w.style.display=i===side?'':'none')}
      b.g.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${h.toFixed(2)})`);
      const ln=b.L[k]+(b.L[k+1]-b.L[k])*u;b.tr.setAttribute('stroke-dashoffset',(b.len-ln).toFixed(1))}
  };
}
const seas=CH.filter(c=>c.type==='sea'||c.type==='cta');
seas[0].draw=makeSea(seas[0].el.querySelector('svg.sea-svg,.sea svg'),[{id:'a',color:'#d4ff3a',x:430,y:1000,h:44,v:34,tack:9},{id:'b',color:'#e0675e',x:650,y:1080,h:-44,v:33,tack:10},{id:'c',color:'#5b8cff',x:1060,y:1060,h:44,v:35,tack:8.5}]);
seas[1].draw=makeSea(seas[1].el.querySelector('svg.cta-sea'),[{id:'d',color:'#d4ff3a',x:300,y:1060,h:44,v:34,tack:11},{id:'e',color:'#f59e0b',x:1250,y:1080,h:-44,v:33,tack:9}]);
seas.forEach(c=>c.draw(4));

/* süreler: video uzunluğu / hız + kısa bekleme */
CH.forEach(c=>{if(c.d)return;c.d=8;const v=c.video;const set=()=>{if(v.duration&&isFinite(v.duration))c.d=v.duration/c.rate+.9};v.addEventListener('loadedmetadata',set);set()});

/* oynatıcı: biri bitince sonrakine geçer, sonuncudan başa döner */
const tabs=document.getElementById('tabs'),say=document.getElementById('say'),pp=document.getElementById('pp'),show=document.getElementById('show');
CH.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',`${i+1}. bölüm`);b.innerHTML='<span><i></i></span>';b.addEventListener('click',()=>go(i));tabs.appendChild(b);c.btn=b});
let cur=-1,el0=0,paused=false,last=performance.now();
function play(c){const v=c.video;if(!v)return;try{v.playbackRate=c.rate||1;const pr=v.play();pr&&pr.catch(()=>{})}catch(e){}}
function go(i){
  if(cur>=0){const p=CH[cur];p.el.classList.remove('on');p.el.setAttribute('aria-hidden','true');if(p.video){const v=p.video;setTimeout(()=>{try{v.pause()}catch(e){}},700)}}
  cur=(i+CH.length)%CH.length;el0=0;const c=CH[cur];
  c.el.classList.add('on');c.el.setAttribute('aria-hidden','false');
  if(c.video){try{c.video.currentTime=0}catch(e){}if(!paused)play(c)}
  CH.forEach((x,j)=>{x.btn.setAttribute('aria-pressed',j===cur);x.btn.classList.toggle('done',j<cur);x.btn.querySelector('i').style.width='0'});
  const tx=c.say||'';say.classList.add('out');
  setTimeout(()=>{say.textContent='';tx.split(' ').filter(Boolean).forEach((w,k)=>{const sp=document.createElement('span');sp.textContent=w;sp.style.animationDelay=(k*40)+'ms';say.appendChild(sp);say.appendChild(document.createTextNode(' '))});say.setAttribute('aria-label',tx);say.classList.remove('out')},300);
  c.btn.scrollIntoView({block:'nearest',inline:'nearest'});
  // bir sonrakinin videosu önceden yüklensin
  const n=CH[(cur+1)%CH.length];if(n.video&&n.video.preload!=='auto')n.video.preload='auto';
}
function setPause(p){paused=p;show.classList.toggle('paused',p);pp.textContent=p?'Devam':'Durdur';const c=CH[cur];if(c.video){if(p){try{c.video.pause()}catch(e){}}else play(c)}}
pp.addEventListener('click',()=>setPause(!paused));
vpt.addEventListener('click',e=>{if(e.target.closest('.cta'))return;setPause(!paused)});
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,button,textarea'))return;if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);else if(e.key===' '){e.preventDefault();setPause(!paused)}});
let tx0=null;vpt.addEventListener('touchstart',e=>{if(e.target.closest('.cta'))return;tx0=e.touches[0].clientX},{passive:true});
vpt.addEventListener('touchend',e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1))},{passive:true});
document.addEventListener('visibilitychange',()=>{last=performance.now()});
addEventListener('resize',()=>{const m=MODE();if(m===mode)return;mode=m;CH.forEach(c=>{if(!c.video||c.one)return;c.video.src=srcOf(c);c.video.load()});const c=CH[cur];if(c.video){c.d=8;if(!paused)play(c)}});
go(0);
(function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;const c=CH[cur];
  if(!paused){el0+=dt;if(c.draw)c.draw(el0+4);
    // video bitmeden süre dolarsa ya da video takılırsa yine de geçer
    c.btn.querySelector('i').style.width=Math.min(100,el0/c.d*100).toFixed(1)+'%';
    if(el0>=c.d)go(cur+1)}
  requestAnimationFrame(loop)})(performance.now());
})();
</script>
