# iPhone uygulamasının (mobil/ios) yerel kodu derleniyor mu: imzasız, simülatör için. Yalnız mobil/ios değişince çalışır.
# App içindeki Apple Watch uygulaması (VeloraSaat) da derlenir: -sdk verilmez, saat hedefi kendi simülatörü için derlensin.
name: iPhone derleme

on:
  pull_request:
    paths:
      - "mobil/ios/**"
      - "mobil/package.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  derle:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios
      - run: xcodebuild -version
      - name: Derle
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > derle.log 2>&1 || { grep -n "error:" derle.log | head -40; tail -60 derle.log; exit 1; }
          tail -30 derle.log
          grep -E "SwiftCompile .*VeloraSaat|VeloraSaat\.app" derle.log | head -5
          grep -q "Debug-watchsimulator/VeloraSaat.app" derle.log || { echo "Saat uygulaması derlenmedi"; exit 1; }
