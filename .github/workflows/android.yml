# Android uygulamasını (mobil/) derler. main'e gelince APK "android" sürümüne konur:
# https://github.com/seyhunDev/sesliasistan/releases/tag/android
name: Android APK

on:
  push:
    paths:
      - "mobil/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      # Bildirimler: Firebase'den indirilen google-services.json, GOOGLE_SERVICES_JSON gizlisinde (depoya konmaz)
      - name: Firebase ayarı
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then printf '%s' "$GS" > android/app/google-services.json; echo "bildirimler açık"; else echo "GOOGLE_SERVICES_JSON yok: bildirimsiz derleniyor"; fi
      # İmza: her APK aynı anahtarla imzalanmalı, yoksa telefon yeni sürümü eskisinin üstüne kurmaz.
      # ANDROID_DEBUG_KEYSTORE gizlisi varsa o (Mac'teki ~/.android/debug.keystore'un base64'ü). Yoksa anahtar bir kez
      # burada üretilir ve şifreli olarak "android-imza" sürümünde saklanır (şifre NETLIFY_AUTH_TOKEN gizlisinden türer;
      # açık dosya hiçbir yere konmaz). Sonraki derlemeler aynı anahtarı oradan alır.
      - name: İmza anahtarı
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          PASS: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; echo "imza: gizliden"; exit 0; fi
          if [ -z "$PASS" ]; then echo "imza: her derlemede yeni (gizli yok)"; exit 0; fi
          K=$(printf '%s' "velora-imza:$PASS" | sha256sum | cut -d' ' -f1)
          if gh release download android-imza -p imza.enc -O /tmp/imza.enc --clobber 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass "pass:$K" -in /tmp/imza.enc -out ~/.android/debug.keystore
            echo "imza: saklanan anahtar"
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Velora" -noprompt
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass "pass:$K" -in ~/.android/debug.keystore -out /tmp/imza.enc
              gh release create android-imza /tmp/imza.enc --title "Android imza (şifreli)" --latest=false \
                --notes "Android APK'nın imza anahtarı, şifreli. Silme: silinirse telefondaki uygulama bir kez kaldırılıp yeniden kurulur." --prerelease
              echo "imza: yeni anahtar üretildi ve saklandı"
            fi
          fi
      - name: APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../asistan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: asistan-apk
          path: mobil/asistan.apk
      - name: Sürüme koy (yalnız main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android asistan.apk --title "Android uygulaması" --latest=false \
            --notes "Velora Android. Telefonda Velora › Ayarlar › Android uygulamasını güncelle ya da asistan.apk'ya dokun, indir, kur. Sürüm 1.0.${GITHUB_RUN_NUMBER} · ${GITHUB_SHA::7}"
